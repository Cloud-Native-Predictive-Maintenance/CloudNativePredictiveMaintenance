<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Health — Predictive Maintenance</title>
<style>
  :root {
    --bg: #16181C;
    --panel: #1E2126;
    --panel-raised: #262A31;
    --border: #33383F;
    --text: #E7E9EC;
    --text-dim: #8A929C;
    --text-faint: #565D66;
    --risk-high: #E5484D;
    --risk-high-bg: rgba(229, 72, 77, 0.12);
    --risk-mod: #F0A63A;
    --risk-mod-bg: rgba(240, 166, 58, 0.12);
    --risk-ok: #3FC98E;
    --risk-ok-bg: rgba(63, 201, 142, 0.1);
    --accent: #5B9DF9;
    --mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
  }
  .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .sidebar { border-right: none; border-bottom: 1px solid var(--border); } }

  /* ---- Sidebar ---- */
  .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-header { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .sidebar-header p { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .fleet-stats { display: flex; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .stat { flex: 1; background: var(--panel-raised); border-radius: 6px; padding: 8px 10px; }
  .stat .n { font-family: var(--mono); font-size: 18px; font-weight: 600; line-height: 1.1; }
  .stat .l { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
  .stat.hi .n { color: var(--risk-high); }
  .stat.mod .n { color: var(--risk-mod); }

  .machine-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .machine-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; cursor: pointer; border-left: 2px solid transparent;
  }
  .machine-row:hover { background: var(--panel-raised); }
  .machine-row.active { background: var(--panel-raised); border-left-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.hi { background: var(--risk-high); box-shadow: 0 0 6px var(--risk-high); }
  .dot.mod { background: var(--risk-mod); }
  .dot.ok { background: var(--risk-ok); }
  .machine-row .id { font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .machine-row .pct { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

  /* ---- Main ---- */
  .main { padding: 28px 36px; overflow-y: auto; }
  .main-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 26px; }
  .main-top .id-block .id { font-family: var(--mono); font-size: 26px; font-weight: 600; }
  .main-top .id-block .sub { color: var(--text-dim); font-size: 12.5px; margin-top: 4px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
  }
  .status-pill.hi { background: var(--risk-high-bg); color: var(--risk-high); }
  .status-pill.mod { background: var(--risk-mod-bg); color: var(--risk-mod); }
  .status-pill.ok { background: var(--risk-ok-bg); color: var(--risk-ok); }
  .status-pill .dot { width: 6px; height: 6px; }
  .status-pill.hi .dot { background: var(--risk-high); }
  .status-pill.mod .dot { background: var(--risk-mod); }
  .status-pill.ok .dot { background: var(--risk-ok); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .card .label { font-size: 11.5px; color: var(--text-dim); margin-bottom: 8px; }
  .card .value { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1; }
  .card .value.hi { color: var(--risk-high); }
  .card .value.mod { color: var(--risk-mod); }
  .card .value.ok { color: var(--risk-ok); }
  .card .unit { font-size: 13px; color: var(--text-dim); font-weight: 400; margin-left: 4px; }

  .bar-track { height: 6px; background: var(--panel-raised); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }

  .section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .section h2 { font-size: 13px; font-weight: 600; margin-bottom: 14px; color: var(--text); }
  .factor-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .factor-row:last-child { border-bottom: none; }
  .factor-row .fname { font-family: var(--mono); font-size: 12.5px; flex: 1; color: var(--text-dim); }
  .factor-bar-track { width: 140px; height: 5px; background: var(--panel-raised); border-radius: 3px; position: relative; overflow: hidden; }
  .factor-bar-fill { position: absolute; top: 0; height: 100%; border-radius: 3px; }
  .factor-bar-fill.up { background: var(--risk-high); left: 50%; }
  .factor-bar-fill.down { background: var(--risk-ok); right: 50%; }
  .factor-dir { font-size: 11px; width: 90px; text-align: right; color: var(--text-faint); }

  .action-banner {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
  }
  .action-banner.hi { background: var(--risk-high-bg); color: var(--risk-high); }
  .action-banner.mod { background: var(--risk-mod-bg); color: var(--risk-mod); }
  .action-banner.ok { background: var(--risk-ok-bg); color: var(--risk-ok); }

  .conn-note { font-size: 11.5px; color: var(--text-faint); margin-top: 20px; text-align: center; }
  .conn-note code { font-family: var(--mono); background: var(--panel-raised); padding: 2px 5px; border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Fleet Health</h1>
      <p>Predictive Maintenance — Live</p>
    </div>
    <div class="fleet-stats" id="fleetStats"></div>
    <div class="machine-list" id="machineList"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
const API_BASE = window.PDM_API_BASE || "http://127.0.0.1:8000";

// Demo fleet used when the API isn't reachable (e.g. viewing this file standalone).
// Wire a real fleet by replacing this with a call to your own /machines listing endpoint.
const DEMO_MACHINES = [
  { machine_id: "M-1024", failure_probability: 0.874, health_status: "HIGH RISK", is_anomaly: true,
    anomaly_score: -0.31, estimated_rul_cycles: 6.2,
    top_contributing_factors: [
      { feature: "sensor_11_slope (Tool Wear)", shap_value: 1.42, direction: "increases risk" },
      { feature: "sensor_9_delta_baseline (Rotational Speed)", shap_value: 1.05, direction: "increases risk" },
      { feature: "sensor_4_roll_mean (Process Temp)", shap_value: 0.88, direction: "increases risk" },
      { feature: "sensor_13_slope (Torque)", shap_value: 0.61, direction: "increases risk" },
    ], recommended_action: "Schedule preventive maintenance." },
  { machine_id: "M-1031", failure_probability: 0.42, health_status: "MODERATE RISK", is_anomaly: true,
    anomaly_score: -0.05, estimated_rul_cycles: 38.5,
    top_contributing_factors: [
      { feature: "sensor_7_delta_baseline", shap_value: 0.51, direction: "increases risk" },
      { feature: "sensor_15_slope", shap_value: 0.33, direction: "increases risk" },
      { feature: "sensor_2_roll_std", shap_value: -0.22, direction: "decreases risk" },
      { feature: "sensor_20_delta_baseline", shap_value: 0.19, direction: "increases risk" },
    ], recommended_action: "Increase monitoring frequency and inspect at next opportunity." },
  { machine_id: "M-1007", failure_probability: 0.06, health_status: "HEALTHY", is_anomaly: false,
    anomaly_score: 0.18, estimated_rul_cycles: 142.0,
    top_contributing_factors: [
      { feature: "sensor_3_roll_mean", shap_value: -0.44, direction: "decreases risk" },
      { feature: "sensor_17_delta_baseline", shap_value: -0.31, direction: "decreases risk" },
      { feature: "sensor_8_slope", shap_value: 0.09, direction: "increases risk" },
      { feature: "sensor_21_roll_std", shap_value: -0.08, direction: "decreases risk" },
    ], recommended_action: "No action needed — continue normal operation." },
  { machine_id: "M-1042", failure_probability: 0.15, health_status: "HEALTHY", is_anomaly: false,
    anomaly_score: 0.24, estimated_rul_cycles: 168.0,
    top_contributing_factors: [
      { feature: "sensor_12_roll_mean", shap_value: -0.28, direction: "decreases risk" },
      { feature: "sensor_9_slope", shap_value: 0.14, direction: "increases risk" },
      { feature: "sensor_4_delta_baseline", shap_value: -0.11, direction: "decreases risk" },
      { feature: "sensor_2_roll_std", shap_value: -0.07, direction: "decreases risk" },
    ], recommended_action: "No action needed — continue normal operation." },
];

let fleet = [];
let activeId = null;

function riskClass(status) {
  if (status === "HIGH RISK") return "hi";
  if (status === "MODERATE RISK") return "mod";
  return "ok";
}

function renderSidebar() {
  const hi = fleet.filter(m => m.health_status === "HIGH RISK").length;
  const mod = fleet.filter(m => m.health_status === "MODERATE RISK").length;
  document.getElementById("fleetStats").innerHTML = `
    <div class="stat hi"><div class="n">${hi}</div><div class="l">High risk</div></div>
    <div class="stat mod"><div class="n">${mod}</div><div class="l">Moderate</div></div>
    <div class="stat"><div class="n">${fleet.length}</div><div class="l">Total units</div></div>
  `;
  document.getElementById("machineList").innerHTML = fleet.map(m => `
    <div class="machine-row ${m.machine_id === activeId ? 'active' : ''}" onclick="selectMachine('${m.machine_id}')">
      <div class="dot ${riskClass(m.health_status)}"></div>
      <div class="id">${m.machine_id}</div>
      <div class="pct">${(m.failure_probability * 100).toFixed(1)}%</div>
    </div>
  `).join("");
}

function renderMain() {
  const m = fleet.find(x => x.machine_id === activeId);
  if (!m) { document.getElementById("main").innerHTML = ""; return; }
  const rc = riskClass(m.health_status);
  const pct = (m.failure_probability * 100).toFixed(1);

  document.getElementById("main").innerHTML = `
    <div class="main-top">
      <div class="id-block">
        <div class="id">${m.machine_id}</div>
        <div class="sub">Updated just now</div>
      </div>
      <div class="status-pill ${rc}"><span class="dot"></span>${m.health_status}</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Failure probability</div>
        <div class="value ${rc}">${pct}<span class="unit">%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background: var(--risk-${rc === 'hi' ? 'high' : rc === 'mod' ? 'mod' : 'ok'})"></div></div>
      </div>
      <div class="card">
        <div class="label">Estimated remaining useful life</div>
        <div class="value">${m.estimated_rul_cycles.toFixed(1)}<span class="unit">cycles</span></div>
      </div>
      <div class="card">
        <div class="label">Anomaly status</div>
        <div class="value ${m.is_anomaly ? 'mod' : 'ok'}">${m.is_anomaly ? 'Flagged' : 'Normal'}</div>
        <div class="sub" style="font-size:11.5px; color:var(--text-dim); margin-top:6px;">score ${m.anomaly_score.toFixed(3)}</div>
      </div>
    </div>

    <div class="section">
      <h2>Top contributing factors (SHAP)</h2>
      ${m.top_contributing_factors.map(f => `
        <div class="factor-row">
          <div class="fname">${f.feature}</div>
          <div class="factor-bar-track">
            <div class="factor-bar-fill ${f.shap_value > 0 ? 'up' : 'down'}" style="width:${Math.min(Math.abs(f.shap_value) * 30, 50)}%"></div>
          </div>
          <div class="factor-dir">${f.direction}</div>
        </div>
      `).join("")}
    </div>

    <div class="action-banner ${rc}">${m.recommended_action}</div>
    <div class="conn-note">Live API: <code>${API_BASE}</code> — showing ${fleet === DEMO_MACHINES ? 'demo' : 'live'} data</div>
  `;
}

function selectMachine(id) {
  activeId = id;
  renderSidebar();
  renderMain();
}

async function tryLoadLive() {
  try {
    const health = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(1500) });
    if (!health.ok) throw new Error("not ok");
    // A real deployment would hit a /machines listing endpoint here and then
    // POST /predict for each. This demo falls back to bundled fleet data
    // since this static file has no live sensor feed of its own.
    fleet = DEMO_MACHINES;
  } catch (e) {
    fleet = DEMO_MACHINES;
  }
  activeId = fleet[0].machine_id;
  renderSidebar();
  renderMain();
}

tryLoadLive();
</script>
</body>
</html>
